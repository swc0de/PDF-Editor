[project]
name = "pdf-editor"
version = "0.1.0"
description = "A lightweight desktop PDF editor built with PySide6 and PyMuPDF."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "PyMuPDF>=1.24", "Pillow>=10.0"]

[project.scripts]
pdf-editor = "pdf_editor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "gui: tests that need a Qt platform (run offscreen)",
    "ocr: tests that need a Tesseract installation",
]
